name: Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-v2.3.2
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Verify release target and tag
        uses: actions/github-script@v7
        with:
          script: |
            if (context.ref !== "refs/heads/dev") {
              core.setFailed("Releases must be started from the dev branch.");
              return;
            }

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "tags/v2.3.2"
              });
              core.setFailed("Tag v2.3.2 already exists. Refusing to overwrite an existing release.");
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info("Tag v2.3.2 does not exist yet. Ready to build.");
            }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ARFX_RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ARFX_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ARFX_RELEASE_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ARFX_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" || -z "$STORE_PASSWORD" ]]; then
            echo "::error::Release signing secrets are missing. Configure all ARFX_RELEASE_* repository secrets before starting a release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arfx-release.jks"
          {
            echo "LOOP_KEY_STORE=$RUNNER_TEMP/arfx-release.jks"
            echo "LOOP_KEY_ALIAS=$KEY_ALIAS"
            echo "LOOP_KEY_PASSWORD=$KEY_PASSWORD"
            echo "LOOP_STORE_PASSWORD=$STORE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Run core unit tests
        run: ./gradlew :uhabits-core:jvmTest --stacktrace --no-daemon

      - name: Compile Android instrumentation tests
        run: ./gradlew :uhabits-android:assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Build signed release APK
        run: ./gradlew :uhabits-android:assembleRelease --stacktrace --no-daemon

      - name: Publish GitHub Release and create tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.2
          target_commitish: ${{ github.sha }}
          name: Habit Tracker v2.3.2
          body_path: docs/RELEASE_NOTES_v2.3.2.md
          files: uhabits-android/build/outputs/apk/release/uhabits-android-release.apk
          generate_release_notes: false
          draft: false
          prerelease: false
